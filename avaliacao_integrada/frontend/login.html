<!doctype html>
<html lang="pt-BR" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar | TransUrban</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="/">TRANSURBAN</a><a href="/">Voltar ao painel</a></header>
  <main class="section">
    <form id="loginForm" class="form-card" style="max-width:440px;margin:auto">
      <p class="eyebrow eyebrow-dark">MODO DEMONSTRAÇÃO</p>
      <h1>Entrar no TransUrban</h1>
      <p>Use os dados fictícios abaixo para conhecer a tela. Não digite sua senha pessoal.</p>
      <p>E-mail: <strong>demo@transurban.test</strong><br>Senha: <strong>transurban-demo</strong></p>
      <label for="email">E-mail de teste</label>
      <input id="email" type="email" required autocomplete="off">
      <label for="senha">Senha de teste</label>
      <input id="senha" type="password" required autocomplete="off">
      <p id="loginStatus" class="status" role="status"></p>
      <button class="button button-primary" type="submit">Entrar no painel</button>
    </form>
  </main>
</body>
</html>
