<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Console TRANSURBAN</title><style>body{font:17px system-ui;max-width:1000px;margin:35px auto;padding:20px;background:#f3f6ef;color:#143f35}button,input,select,textarea{font:inherit;padding:12px;border:1px solid #b1c4b7;border-radius:8px}button{background:#143f35;color:white;cursor:pointer;margin:8px 0}textarea{display:block;width:94%;min-height:105px;margin:12px 0}pre{white-space:pre-wrap;background:#122c27;color:#d5eeac;padding:20px;border-radius:12px;max-height:600px;overflow:auto}.row{display:flex;gap:10px;flex-wrap:wrap}a{color:inherit}</style><a href="/apresentacao">← Painel</a><h1>API real · console offline</h1><p>Este formulário envia requisições HTTP para o banco local. POST cria registros persistentes. O cenário do site tem dados separados.</p><label>Exemplo <select id="exemplo"><option value="cidades">Cadastrar cidade</option><option value="linhas">Cadastrar linha</option><option value="resumo">Resumo do CSV</option><option value="qualidade">Qualidade do CSV</option><option value="fonte">Fonte do CSV</option><option value="agrupamento">Agrupar por cidade</option><option value="listar">Listar cidades</option><option value="listarlinhas">Listar linhas</option></select></label><p class="row"><select id="metodo" aria-label="Método"><option>GET</option><option>POST</option></select><input id="rota" value="/cidades" aria-label="Rota" size="34"></p><label>Corpo JSON (apenas POST)<textarea id="corpo">{"nome":"Maringá"}</textarea></label><button id="enviar">Executar requisição</button><p id="status" role="status"></p><pre id="resultado">Escolha um exemplo e execute.</pre><script>const $=s=>document.querySelector(s);const exemplos={cidades:['POST','/cidades',{nome:'Maringá'}],linhas:['POST','/linhas',{codigo:'DEMO-01',nome:'Linha de demonstração',id_cidade:1}],resumo:['GET','/ia/resumo'],qualidade:['GET','/ia/qualidade'],fonte:['GET','/ia/fonte'],agrupamento:['GET','/ia/agrupamentos/cidade'],listar:['GET','/cidades'],listarlinhas:['GET','/linhas']};function escolher(){const e=exemplos[$('#exemplo').value];$('#metodo').value=e[0];$('#rota').value=e[1];$('#corpo').value=e[2]?JSON.stringify(e[2],null,2):''}$('#exemplo').onchange=escolher;escolher();$('#enviar').onclick=async()=>{try{const rota=$('#rota').value;if(!rota.startsWith('/')||rota.startsWith('//'))throw Error('Informe uma rota local iniciada com /.');const op={method:$('#metodo').value};if(op.method==='POST'){op.headers={'Content-Type':'application/json'};op.body=JSON.stringify(JSON.parse($('#corpo').value))}const r=await fetch(rota,op);$('#status').textContent='HTTP '+r.status+' '+r.statusText;const t=await r.text();try{$('#resultado').textContent=JSON.stringify(JSON.parse(t),null,2)}catch{$('#resultado').textContent=t}}catch(e){$('#status').textContent='Erro: '+e.message}};</script></html>
