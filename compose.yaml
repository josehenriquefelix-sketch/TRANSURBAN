services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_DB: transurban_local
      POSTGRES_USER: transurban_local
      POSTGRES_PASSWORD: transurban_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - banco_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transurban_local -d transurban_local"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  banco_local:
