# Site e FastAPI na mesma origem; o banco existente permanece no Supabase.
services:
  - type: web
    name: transurban
    runtime: python
    plan: free
    rootDir: avaliacao_integrada
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: COOKIE_SECURE
        value: 'true'
      - key: CORS_ORIGINS
        value: ''
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
